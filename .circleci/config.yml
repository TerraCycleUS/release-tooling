version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23.2
        environment:
          JIRA_PROJECT: ITG
          JIRA_BROWSE_URL: https://terracycle.atlassian.net/browse

jobs:
  test:
    executor: node
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Test
          command: npm test
      # The rules this package defines apply to it too; it is a public repository, so the
      # check reads its own pull request without a token.
      - run:
          name: Verify branch and pull request title rules
          command: node bin/validate-pull-request.mjs

  # Publishing needs write:packages, which only RELEASE_PLEASE_TOKEN carries. Consumers
  # never see it: they install from git, tokenless. This job is tags-only and never runs
  # on a branch, so branch code cannot reach the token.
  publish:
    executor: node
    steps:
      - checkout
      - run:
          name: Publish to GitHub Packages
          command: |
            set -euo pipefail

            tag="${CIRCLE_TAG#v}"
            version=$(node -p "require('./package.json').version")
            if [ "$tag" != "$version" ]; then
              echo "Tag $CIRCLE_TAG does not match package version $version." >&2
              exit 1
            fi

            npm config set //npm.pkg.github.com/:_authToken "$RELEASE_PLEASE_TOKEN"
            npm publish

workflows:
  test-and-publish:
    jobs:
      - test:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - publish:
          context: tc-loop-release-please
          requires:
            - test
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
